name: Günlük Portföy Raporu

on:
  schedule:
    # Hafta içi her gün 18:30 (TR / UTC+3) -> 15:30 UTC (BIST kapanışı sonrası)
    - cron: "30 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate report (and send email if configured)
        env:
          PORTFOLIO_JSON: ${{ secrets.PORTFOLIO_JSON }}
          DASHBOARD_PIN: ${{ secrets.DASHBOARD_PIN }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: |
          if [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASS" ]; then
            python src/main.py --send-email
          else
            echo "SMTP secrets tanimli degil, sadece web paneli uretiliyor..."
            python src/main.py
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build-and-notify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
